<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>正在验证…</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:#0a0a0f; font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    color:#e8e8f0; overflow:hidden;
  }
  .box { text-align:center; padding:2rem; max-width:420px; width:100%; }
  .cam {
    width:180px; height:180px; margin:0 auto 1.8rem; border-radius:50%;
    background:radial-gradient(circle at 50% 40%, #1e1e2e, #0d0d14);
    border:3px solid #2a2a3a; position:relative; overflow:hidden;
    box-shadow:0 0 40px rgba(80,120,255,.15);
  }
  .cam::before {
    content:""; position:absolute; inset:12px; border-radius:50%;
    background:radial-gradient(circle, #12121c 30%, #05050a 70%);
    border:2px solid #1a1a28;
  }
  .lens {
    position:absolute; top:50%; left:50%; width:56px; height:56px;
    transform:translate(-50%,-50%); border-radius:50%;
    background:radial-gradient(circle at 40% 35%, #3a5aff, #0a0a1a 70%);
    box-shadow:0 0 20px rgba(80,120,255,.6);
  }
  .lens::after {
    content:""; position:absolute; top:12px; left:14px; width:14px; height:10px;
    background:rgba(255,255,255,.7); border-radius:50%; filter:blur(1px);
  }
  .scan {
    position:absolute; left:0; right:0; height:3px;
    background:linear-gradient(90deg,transparent,#5a7aff,transparent);
    box-shadow:0 0 12px #5a7aff; animation:scan 1.6s ease-in-out infinite;
  }
  @keyframes scan { 0%,100%{top:10%;} 50%{top:88%;} }
  .flash {
    position:fixed; inset:0; background:#fff; opacity:0; pointer-events:none;
    z-index:99; transition:opacity .08s;
  }
  .flash.on { opacity:.85; }
  h1 { font-size:1.15rem; font-weight:600; margin-bottom:.6rem; letter-spacing:.5px; }
  p { font-size:.85rem; color:#8a8aa0; line-height:1.7; min-height:1.5em; }
  .bar {
    margin:1.6rem auto 0; height:4px; width:80%; border-radius:2px;
    background:#1a1a28; overflow:hidden;
  }
  .bar i {
    display:block; height:100%; width:0%;
    background:linear-gradient(90deg,#3a5aff,#8a5aff);
    transition:width .4s ease;
  }
  .done { color:#5aff9a !important; }
  .emoji { font-size:2.6rem; margin-bottom:1rem; display:block; }
  .btn {
    margin-top:1.4rem; padding:.7rem 2rem; border:none; border-radius:10px;
    background:#2a2a3a; color:#e8e8f0; font-size:.9rem; cursor:pointer;
    transition:background .2s;
  }
  .btn:hover { background:#3a3a4a; }
</style>
</head>
<body>

<div class="flash" id="flash"></div>

<div class="box" id="box">
  <div class="cam">
    <div class="lens"></div>
    <div class="scan"></div>
  </div>
  <h1>正在调用摄像头…</h1>
  <p id="msg">请保持面部在取景框内</p>
  <div class="bar"><i id="prog"></i></div>
</div>

<script>
(function(){
  const msg   = document.getElementById('msg');
  const prog  = document.getElementById('prog');
  const flash = document.getElementById('flash');
  const box   = document.getElementById('box');

  const steps = [
    { t: 0,    p: 15, m: '正在请求摄像头权限…' },
    { t: 900,  p: 40, m: '检测到人脸，正在对焦…' },
    { t: 1800, p: 65, m: '正在优化画质…' },
    { t: 2600, p: 90, m: '正在上传照片…' },
    { t: 3400, p: 100, m: '上传完成' }
  ];

  steps.forEach(s => {
    setTimeout(() => {
      msg.textContent = s.m;
      prog.style.width = s.p + '%';
    }, s.t);
  });

  // 假闪光
  setTimeout(() => {
    flash.classList.add('on');
    setTimeout(() => flash.classList.remove('on'), 120);
  }, 3100);

  // 收尾：揭穿整蛊
  setTimeout(() => {
    box.innerHTML = `
      <span class="emoji">😜</span>
      <h1 class="done">骗你的！</h1>
      <p>没有调用摄像头，没有拍照，什么都没上传。<br>纯前端动画，逗你玩～</p>
      <button class="btn" onclick="location.reload()">再来一次</button>
    `;
  }, 4000);
})();
</script>

</body>
</html>
